services:
  backend:
    container_name: app
    image: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_USERNAME: "app"
      DB_PASSWORD: "insecure"
      DB_PORT: "3306"
  db:
    container_name: goddit_db
    image: mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "insecure"
    volumes:
      - ./db/setup.sql:/docker-entrypoint-initdb.d/1_setup.sql
      - ./db/initial_data.sql:/docker-entrypoint-initdb.d/2_initial_data.sql
volumes:
  db-data: